name: Python application

on:
  # genera un push o pull request a main para ejecutar el workflow

  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # coje una imagen de ubuntu para ejecutar el workflow
    runs-on: ubuntu-latest
    # pasos a ejecutar en el workflow
    steps:
      # descargar el codigo del repositorio al servidor de github actions
      - uses: actions/checkout@v4
      # configurar el entorno de python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      # instalar las dependencias del proyecto.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # ejecutar el linter flake8 para revisar el codigo y mostrar los errores de sintaxis o complejidad
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      # ejecutar el linter ruff para revisar el codigo y mostrar los errores de sintaxis o complejidad
      - name: Check linting with ruff
        run: |
          ruff check .
      # iniciar sesion en el registro de contenedores de github para poder subir la imagen del proyecto
      - name: Loging to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # construir la imagen del proyecto y subirla al registro de contenedores de github
      - name: Test with pytest
        env:
          PYTHONPATH: .
        run: |
          pytest
      # subir los resultados de la ejecucion del pipeline como artefactos para poder descargarlos despues
      - name: Upload Pipipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-execution-results
          path: |
            results/
            models/*.pkl
      #  pytest
      - name: Run pytest and generate coverage report
        run: pytest test/test_modelo.py --cov=src --cov-report=xml --cov-report=html
