version: '4.73.1'

services:
  db:
    image: postgres:15
    container_name: postgres_churn
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build: .
    container_name: pipeline_ingestion
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./results:/app/results
      - ./results:/app/results/logs
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # diccionario. 
    environment:
      PYTHONUNBUFFERED: "1"
      # En la sección de entorno (environment) de tu docker-compose.yml:
      DATA_SOURCE_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYnQc-SvTC4anvw2i5fhfq5-P4l7T8BACyQ9_wDdi2gmm1e7Bc_1f2D95K0QI6o4lJhxikMB8zgWz4/pubhtml"
    command: ["python", "src/pipeline.py"]

volumes:
  postgres_data:
  