version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_churn
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: src/Dockerfile.api
    container_name: pipeline_ingestion
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "src.pipeline"]

  dashboard:
    build:
      context: .
      dockerfile: src/Dockerfile.streamlit
    container_name: streamlit_churn
    restart: unless-stopped
    working_dir: /app
    ports:
      - "10000:10000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command:
      [
        "streamlit",
        "run",
        "src/app.py",
        "--server.port",
        "10000",
        "--server.address",
        "0.0.0.0",
      ]

volumes:
  postgres_data:
