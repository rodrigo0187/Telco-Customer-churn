app:
    build: .
    container_name: pipeline_streamlit_app
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      # Dejamos los volúmenes solo para desarrollo (cambios en vivo), 
      # pero ahora el comando ya no dependerá exclusivamente de ellos.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: db    
      DB_PORT: 5432
    # Al estar parados en working_dir (/app), ejecutamos directamente app.py indicando su subcarpeta src
    command: ["streamlit", "run", "src/app.py", "--server.port=8501", "--server.address=0.0.0.0"]