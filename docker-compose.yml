services:
  db:
    image: postgres:15-alpine
    container_name: postgres_churn
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build: .
    container_name: pipeline_ingestion
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Sobrescribimos el CMD del Dockerfile para ejecutar el pipeline secuencial
    command: ["python", "src/pipeline.py"]

  dashboard:
    build: .
    container_name: streamlit_churn
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data: